[package]
name = "gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Builds the omarchy-wallpapers gallery, previews and Aether blueprints from wallpapers.tsv"
license = "MIT"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
